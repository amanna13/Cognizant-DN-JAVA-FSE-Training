<article class="course-card" [ngClass]="cardClasses" [ngStyle]="{ 'border-left-color': borderColor }" (click)="navigateToCourse()">
  <h3>{{ course.name }}</h3>
  <p>Code: {{ course.code }}</p>
  <p>Credits: {{ course.credits | creditLabel }}</p>
  <p>ID: {{ course.id }}</p>

  <p [ngSwitch]="course.gradeStatus">
    <span *ngSwitchCase="'passed'" class="status status--passed">Passed</span>
    <span *ngSwitchCase="'failed'" class="status status--failed">Failed</span>
    <span *ngSwitchDefault class="status status--pending">Pending</span>
  </p>

  <div class="actions">
    <button type="button" (click)="$event.stopPropagation(); onEnrollClick()">{{ enrollButtonLabel }}</button>
    <button type="button" (click)="$event.stopPropagation(); toggleDetails()">Show Details</button>
  </div>
</article>
